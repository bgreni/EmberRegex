name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Linux only. Formatting is a property of the source text, not of
    # the target, so a second runner would re-check the same bytes for
    # the same answer. Tests and benchmarks are matrixed because their
    # results genuinely differ per platform; this does not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Derived from $RUNNER_TEMP in a step rather than in a job-level
      # `env:` block: the `runner` context is not available there, because
      # the job's environment is evaluated before a runner is assigned.
      # A workflow that references it fails to start at all.
      - name: Configure paths
        run: echo "MODULAR_CACHE_DIR=$RUNNER_TEMP/mojo-cache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install pixi
        id: pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          echo "version=$("$HOME/.pixi/bin/pixi" --version | tr ' ' '-')" \
            >> "$GITHUB_OUTPUT"

      - name: Cache pixi environment
        uses: actions/cache@v4
        with:
          path: .pixi
          key: >-
            pixi-${{ runner.os }}-${{ runner.arch }}-${{
            steps.pixi.outputs.version }}-${{ hashFiles('pixi.lock') }}

      # --locked also makes a pixi.lock that has drifted from
      # pixi.toml fail here rather than silently re-solving.
      - name: Install environment
        run: pixi install --locked

      # `mojo format` has no --check mode, so the gate is: format in
      # place, then require the tree to be unchanged.
      - name: Check formatting
        run: |
          set -o pipefail
          status=0
          pixi run format 2>&1 | tee "$RUNNER_TEMP/format.log" || status=$?

          if ! git diff --quiet; then
            echo "::error title=Formatting::\`pixi run format\` modified tracked files. Run it locally and commit the result."
            git --no-pager diff
            exit 1
          fi

          unparseable="$(grep -c '^error: cannot format' "$RUNNER_TEMP/format.log" || true)"
          if [ "$unparseable" -gt 0 ]; then
            echo "::error title=Formatter::mojo format could not parse $unparseable file(s), so they were never checked. This is an internal formatter failure, not a formatting violation."
            grep '^error: cannot format' "$RUNNER_TEMP/format.log"
            exit 1
          fi

          echo "No formatting changes required (mojo format exit status: $status)."
