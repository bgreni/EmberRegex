name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # Both platforms always report: one failing must not cancel the
      # other, or a Linux-only break hides the macOS result and back.
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # The Mojo compile cache defaults to a path *inside* .pixi. Left
      # there it would be swept into the environment cache below, which
      # is keyed on pixi.lock alone and would balloon to gigabytes.
      #
      # Derived from $RUNNER_TEMP in a step rather than in a job-level
      # `env:` block: the `runner` context is not available there, because
      # the job's environment is evaluated before a runner is assigned.
      # A workflow that references it fails to start at all.
      - name: Configure paths
        run: echo "MODULAR_CACHE_DIR=$RUNNER_TEMP/mojo-cache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Unit tests for run_test.py / run_coverage.py: stdlib-only Python,
      # so the runner's own interpreter will do, and one OS is enough.
      - name: Test the test tooling
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Install pixi
        id: pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          echo "version=$("$HOME/.pixi/bin/pixi" --version | tr ' ' '-')" \
            >> "$GITHUB_OUTPUT"

      - name: Cache pixi environment
        uses: actions/cache@v4
        with:
          path: .pixi
          key: >-
            pixi-${{ runner.os }}-${{ runner.arch }}-${{
            steps.pixi.outputs.version }}-${{ hashFiles('pixi.lock') }}

      # --locked also makes a pixi.lock that has drifted from
      # pixi.toml fail here rather than silently re-solving.
      - name: Install environment
        run: pixi install --locked

      # run_test.py keys each green result on a hash of the test file,
      # every library source, the compiler version, the runner itself and
      # the mojo flags, so a restored (even stale) results.json can only
      # ever skip files whose bytes genuinely did not change.
      - name: Restore incremental test results
        uses: actions/cache@v4
        with:
          path: .test_cache
          key: >-
            test-cache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            test-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock') }}-
            test-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Run test suite
        run: pixi run test
